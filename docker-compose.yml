services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - "5433:5432"
    volumes:
      - docqa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  docqa_pg_data:
